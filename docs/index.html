<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Рейтинг игроков "ЛЛ"</title>
<link rel="icon" type="image/png" href="favicon.png" />
<script>
  // Тема выставляется до отрисовки (без вспышки): сохранённый выбор, иначе системная.
  (function () {
    var t = null;
    try { t = localStorage.getItem("llstat:theme"); } catch (e) {}
    if (t !== "light" && t !== "dark") {
      t = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    }
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<style>
  :root {
    color-scheme: dark;
    --on-accent: #0c1420; /* текст на акцентной заливке */
    --bg: #14161c;
    --bg-panel: #1b1e26;
    --bg-row: #1b1e26;
    --bg-row-alt: #20232c;
    --bg-row-hover: #262a35;
    --border: #2c303b;
    --text: #e6e8ef;
    --text-dim: #9096a6;
    --text-faint: #5b6172;
    --accent: #6ea8ff;
    --accent-bg: rgba(110, 168, 255, 0.14);
    --green: #3ecf6e;
    --green-bg: rgba(62, 207, 110, 0.14);
    --yellow: #e0c34c;
    --yellow-bg: rgba(224, 195, 76, 0.12);
    --orange: #e0923e;
    --orange-bg: rgba(224, 146, 62, 0.14);
    --red: #e0625c;
    --red-bg: rgba(224, 98, 92, 0.14);
    --maroon: #9b2d30;
    --maroon-bg: rgba(155, 45, 48, 0.18);
  }

  /* Светлая тема: тот же набор переменных. Цвета статусов — тёмные оттенки,
     чтобы текст на светлой плашке читался (≥ 4.5:1). */
  :root[data-theme="light"] {
    color-scheme: light;
    --on-accent: #ffffff;
    --bg: #f1f3f7;
    --bg-panel: #ffffff;
    --bg-row: #ffffff;
    --bg-row-alt: #f6f8fb;
    --bg-row-hover: #e9edf4;
    --border: #d6dbe5;
    --text: #1a1f2b;
    --text-dim: #556074;
    --text-faint: #6b7487;
    --accent: #2563eb;
    --accent-bg: rgba(37, 99, 235, 0.10);
    --green: #157a3d;
    --green-bg: rgba(21, 122, 61, 0.12);
    --yellow: #8a6700;
    --yellow-bg: rgba(190, 140, 0, 0.16);
    --orange: #b4530a;
    --orange-bg: rgba(200, 100, 10, 0.14);
    --red: #c42d28;
    --red-bg: rgba(196, 45, 40, 0.12);
    --maroon: #8f1d22;
    --maroon-bg: rgba(143, 29, 34, 0.12);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 14px;
    padding: 16px;
    padding-bottom: 48px;
  }

  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .title-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 0 4px;
  }
  .theme-toggle {
    margin-left: auto;
    width: 34px;
    height: 34px;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-panel);
    color: var(--text-dim);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
  }
  .theme-toggle:hover { color: var(--text); border-color: var(--text-dim); }
  .theme-toggle svg { width: 18px; height: 18px; }
  .theme-toggle .i-moon { display: none; }
  :root[data-theme="light"] .theme-toggle .i-sun { display: none; }
  :root[data-theme="light"] .theme-toggle .i-moon { display: block; }
  .title-row img {
    width: 26px;
    height: 26px;
    border-radius: 4px;
  }
  h1 {
    font-size: 18px;
    margin: 0;
  }

  .subtitle {
    color: var(--text-dim);
    font-size: 12px;
    margin-bottom: 16px;
  }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    margin-bottom: 12px;
  }

  .tabs {
    display: flex;
    gap: 4px;
    background: var(--bg-panel);
    padding: 4px;
    border-radius: 8px;
    border: 1px solid var(--border);
    max-width: 100%;
  }

  .tab {
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    color: var(--text-dim);
    font-size: 13px;
    user-select: none;
    white-space: nowrap;
  }
  /* шесть вкладок не помещаются в один ряд на телефоне — делаем два ряда по три
     вкладки поровну на всю ширину блока (сетка из 6 колонок, каждая вкладка
     занимает по 2) */
  @media (max-width: 520px) {
    .tabs {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      flex: 1 1 100%;
    }
    .tab { grid-column: span 2; padding: 6px 4px; text-align: center; }
  }

  .tab.active {
    background: var(--accent);
    color: var(--on-accent);
    font-weight: 600;
  }

  /* margin-left: auto держит ссылку у правого края тулбара (над колонкой
     "Рейтинг"), даже когда на узком экране она переносится на свою строку. */
  .rating-info-link {
    margin-left: auto;
    font-size: 13px;
    color: var(--text-dim);
    align-self: center;
    white-space: nowrap;
  }
  .rating-info-link:hover { color: var(--accent); }

  .banner {
    background: var(--yellow-bg);
    border: 1px solid var(--yellow);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 13px;
    margin-bottom: 12px;
  }

  .session-picker { margin-bottom: 8px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .session-picker select {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 13px;
    max-width: 100%;
  }
  .session-header {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 12px;
    font-size: 13px;
    color: var(--text-dim);
  }
  .session-header .session-id {
    color: var(--text);
    font-weight: 600;
    font-size: 14px;
  }
  .session-maps {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 14px;
    margin-top: 8px;
  }
  .session-maps a { color: var(--text-dim); }
  .session-maps a:hover { color: var(--accent); }

  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--bg-panel);
    border-radius: 8px;
    overflow: hidden;
  }

  thead th {
    text-align: right;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--text-faint);
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    white-space: nowrap;
    user-select: none;
  }
  thead th:first-child { text-align: left; }
  thead th.sorted { color: var(--accent); }

  tbody td {
    padding: 8px 10px;
    text-align: right;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  tbody td:first-child { text-align: left; }

  tbody tr.player-row { cursor: pointer; }
  tbody tr.player-row:hover { background: var(--bg-row-hover); }

  .map-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
  }
  .map-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--bg-panel);
    color: var(--text-dim);
    font-size: 13px;
    cursor: pointer;
  }
  .map-chip:hover { background: var(--bg-row-hover); color: var(--text); }
  .map-chip.active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--on-accent);
    font-weight: 600;
  }
  .map-chip-count { color: var(--text-faint); font-size: 11px; }
  .map-chip.active .map-chip-count { color: var(--on-accent); opacity: 0.7; }
  .map-chip-icon {
    width: 22px;
    height: 22px;
    object-fit: contain;
    flex-shrink: 0;
  }

  /* Баннер вкладки "Карты": кадр выбранной карты, поверх — название и
     чипы. Два слоя фона нужны для плавной смены кадра: новый слой
     проявляется только после того, как картинка догрузилась. */
  .map-hero {
    position: relative;
    min-height: 260px;
    margin-bottom: 12px;
    border-radius: 8px;
    overflow: hidden;
    background: linear-gradient(135deg, #252b3b 0%, #1b1e26 60%, #14161c 100%); /* баннер карты тёмный в обеих темах */
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }
  .map-hero-bg {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center 60%;
    opacity: 0;
    transition: opacity 0.45s ease;
  }
  .map-hero-bg.shown { opacity: 1; }
  .map-hero::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(to bottom, rgba(20, 22, 28, 0.05) 0%, rgba(20, 22, 28, 0.45) 50%, rgba(20, 22, 28, 0.92) 100%),
      linear-gradient(to right, rgba(20, 22, 28, 0.55) 0%, rgba(20, 22, 28, 0) 60%);
    pointer-events: none;
  }
  .map-hero-content {
    position: relative;
    z-index: 1;
    padding: 16px;
  }
  .map-hero-title {
    font-size: 30px;
    font-weight: 700;
    line-height: 1.1;
    color: #fff;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
  }
  .map-hero-sub {
    margin: 4px 0 12px;
    font-size: 13px;
    color: rgba(255, 255, 255, 0.75);
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.6);
  }
  .map-hero .map-chips { margin-bottom: 0; }
  .map-hero .map-chip {
    background: rgba(20, 22, 28, 0.6);
    border-color: rgba(255, 255, 255, 0.14);
    color: rgba(255, 255, 255, 0.85);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
  }
  .map-hero .map-chip:hover { background: rgba(38, 42, 53, 0.85); color: #fff; }
  .map-hero .map-chip-count { color: rgba(255, 255, 255, 0.55); }
  .map-hero .map-chip.active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--on-accent);
  }
  .map-hero .map-chip.active .map-chip-count { color: var(--on-accent); }
  @media (prefers-reduced-motion: reduce) {
    .map-hero-bg { transition: none; }
  }
  tbody tr.unqualified { color: var(--text-faint); }
  tbody tr.unqualified .player-name { color: var(--text-dim); }

  .player-cell {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .avatar {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--border);
    flex-shrink: 0;
    object-fit: cover;
  }
  .player-cell a {
    display: flex;
    align-items: center;
    gap: 8px;
    color: inherit;
  }
  .player-text {
    display: flex;
    flex-direction: column;
    gap: 1px;
    min-width: 0;
  }
  .player-cell a:hover .player-name { text-decoration: underline; }

  .rating-cell {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 2px 8px;
    border-radius: 5px;
    font-variant-numeric: tabular-nums;
  }
  .tier-green { background: var(--green-bg); color: var(--green); }
  .tier-yellow { background: var(--yellow-bg); color: var(--yellow); }
  .tier-orange { background: var(--orange-bg); color: var(--orange); }
  .tier-red { background: var(--maroon-bg); color: var(--maroon); }
  .tier-neutral { background: var(--accent-bg); color: var(--accent); }
  .tier-accent { background: var(--red-bg); color: var(--red); }
  .rating-na { color: var(--text-faint); }

  .rating-with-delta {
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .rating-delta {
    display: inline-flex;
    justify-content: center;
    flex-shrink: 0;
    width: 26px;
    height: 22px;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: -0.4px;
    color: var(--bg);
  }
  .rating-delta-up {
    align-items: flex-end;
    padding-bottom: 1px;
    clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
    background: var(--green);
  }
  .rating-delta-down {
    align-items: flex-start;
    padding-top: 1px;
    clip-path: polygon(50% 100%, 100% 0%, 0% 0%);
    background: var(--red);
  }
  .rating-delta-flat {
    align-items: center;
    border-radius: 4px;
    background: var(--accent);
  }

  .maps-cell small { color: var(--text-faint); font-weight: 400; }

  .qual-divider td {
    padding: 4px 10px;
    border-bottom: 1px solid var(--border);
    color: var(--text-faint);
    font-size: 11px;
    background: var(--bg);
  }

  tr.detail-row td {
    background: var(--bg);
    padding: 12px 16px 18px;
    cursor: default;
  }
  tr.detail-row[hidden] { display: none; }

  .detail-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
    gap: 10px 18px;
  }
  .detail-metric .label {
    font-size: 10px;
    text-transform: uppercase;
    color: var(--text-faint);
    letter-spacing: 0.03em;
  }
  .detail-metric .value {
    font-size: 15px;
    font-variant-numeric: tabular-nums;
  }

  footer {
    margin-top: 16px;
    color: var(--text-faint);
    font-size: 12px;
  }

  /* На телефоне таблица сворачивается до Игрок (+ строка с Карт/K-D/K-D под
     именем) / Рейтинг — сами колонки Карт/K/D/K-D прячутся, но их значения
     не пропадают, а переезжают во вторую строку под именем игрока. */
  .player-meta { display: none; }
  .mobile-sort { display: none; }
  @media (max-width: 640px) {
    .req-collapse { display: none; }
    .player-meta {
      display: block;
      font-size: 11px;
      color: var(--text-faint);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    body { padding-left: 8px; padding-right: 8px; }

    /* Баннер на телефоне ниже, а чипы — одной строкой с прокруткой
       пальцем вбок: в несколько рядов они раздували бы баннер. */
    .map-hero { min-height: 190px; }
    .map-hero-content { padding: 12px 0; }
    .map-hero-title { font-size: 24px; padding: 0 12px; }
    .map-hero-sub { margin-bottom: 10px; padding: 0 12px; }
    .map-hero .map-chips {
      flex-wrap: nowrap;
      overflow-x: auto;
      padding: 0 12px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .map-hero .map-chips::-webkit-scrollbar { display: none; }
    .map-hero .map-chip { flex-shrink: 0; }
    table { font-size: 13px; }
    thead th, tbody td { padding: 8px 6px; }

    /* На телефоне заголовки Карт/K/D/K-D скрыты вместе с колонками (см. выше),
       а вместе с ними пропадает и клик для сортировки по ним — этот блок
       отдаёт то же самое через выпадающий список + кнопку направления. */
    .mobile-sort {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    .mobile-sort select {
      flex: 1;
      background: var(--bg-panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 13px;
    }
    .mobile-sort button {
      background: var(--bg-panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 14px;
      cursor: pointer;
    }
  }

  .wheel-spin-btn {
    background: var(--accent);
    color: var(--on-accent);
    border: none;
    border-radius: 8px;
    padding: 10px 22px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .wheel-spin-btn:disabled { opacity: 0.5; cursor: default; }

  .sm-section {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-top: 12px;
  }
  .sm-section h3 { margin: 0 0 10px; font-size: 15px; }
  .sm-row { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 8px; }
  .sm-head {
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    height: 54px;
    padding: 0 14px;
    border: 0;
    background: var(--bg);
    color: #fff;
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .sm-head:disabled { cursor: default; }
  .sm-head img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .sm-head::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(10, 14, 22, 0.85) 0%, rgba(10, 14, 22, 0.35) 100%); }
  .sm-head > span { position: relative; z-index: 1; }
  .sm-n { width: 18px; color: rgba(255, 255, 255, 0.7); font-size: 13px; }
  .sm-name { font-size: 16px; font-weight: 700; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7); }
  .sm-score { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; }
  .sm-chev { width: 12px; color: rgba(255, 255, 255, 0.7); }
  .sm-body { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding: 10px; background: var(--bg); }
  .sm-body[hidden] { display: none; }
  @media (max-width: 640px) { .sm-body { grid-template-columns: minmax(0, 1fr); } }
  .sm-team { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
  .sm-team h4 { margin: 0 0 4px; font-size: 13px; display: flex; justify-content: space-between; gap: 8px; }
  .sm-team.win { border-left: 3px solid var(--accent); }
  .sm-team.lose .sm-pname, .sm-team.lose .sm-kda { color: var(--text-dim); }
  .sm-badge {
    flex: none;
    padding: 1px 8px;
    border-radius: 999px;
    background: var(--accent);
    color: var(--on-accent);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.06em;
  }
  .sm-cols { text-align: right; font-size: 11px; color: var(--text-faint); }
  .sm-p { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: 13px; }
  .sm-avatar { width: 20px; height: 20px; border-radius: 50%; object-fit: cover; background: var(--border); flex: none; }
  .sm-pname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sm-kda { color: var(--text-dim); font-variant-numeric: tabular-nums; }

  .md-section {
    position: relative;
    overflow: hidden;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
  }
  /* Фон "радар" в стиле миникарты CS2 (SVG, рисуется кодом, цвета темы сайта)
     только у пустой вкладки; контент лежит выше (z-index). */
  .md-bg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; color: var(--accent); }
  .md-section > :not(.md-bg) { position: relative; z-index: 2; }
  .md-section.md-empty-state { min-height: 240px; display: flex; flex-direction: column; justify-content: center; text-align: center; }
  .md-empty-title { margin: 0; font-size: 20px; font-weight: 700; }
  .md-empty-sub { margin: 8px 0 0; color: var(--text-dim); font-size: 14px; }
  .md-title { margin: 0 0 4px; font-size: 18px; }
  .md-date { margin: 0 0 14px; font-size: 15px; color: var(--accent); }
  .md-date::first-letter { text-transform: uppercase; }
  .md-empty { color: var(--text-dim); font-size: 14px; margin: 0; }
  .md-block { margin-top: 18px; }
  .md-block h3 { margin: 0 0 10px; font-size: 15px; }
  .md-saved { margin-top: 6px; color: var(--text-dim); font-size: 12px; }
  .md-teams { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 640px) { .md-teams { grid-template-columns: minmax(0, 1fr); } }
  .md-team {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .md-team h4 { margin: 0 0 8px; font-size: 14px; }
  .md-team ul { list-style: none; margin: 0; padding: 0; }
  .md-team li { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 14px; }

<body>
  <div class="title-row">
    <img src="favicon.png" alt="" />
    <h1>Рейтинг игроков "ЛЛ"</h1>
    <button type="button" class="theme-toggle" id="themeToggle" aria-label="Переключить тему">
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
  <div class="subtitle" id="subtitle">Загрузка…</div>

  <div id="qualBanner"></div>

  <div class="toolbar">
    <div class="tabs">
      <div class="tab active" data-tab="allTime">За всё время</div>
      <div class="tab" data-tab="lastSession">Сессии</div>
      <div class="tab" data-tab="draft">Выбор составов</div>
      <div class="tab" data-tab="matchday">MatchDay</div>
      <div class="tab" data-tab="maps">Карты</div>
      <div class="tab" data-tab="records">Рекорды</div>
    </div>
    <a class="rating-info-link" href="rating-info.html" target="_blank" rel="noopener">Информация о рейтинге →</a>
  </div>

  <div id="sessionHeader"></div>
  <div id="mapChips"></div>
  <div class="mobile-sort" id="mobileSort"></div>
  <div id="tableWrap"></div>
  <div id="historySection"></div>
  <div id="recordsSection"></div>
  <div id="sessionMapsSection"></div>
  <div id="draftSection"></div>
  <div id="matchdaySection"></div>

  <footer id="footer"></footer>

<script>
(function () {
  "use strict";

  var REQUIRED_COLUMNS = [
    { id: "name", label: "Игрок" },
    { id: "mapsPlayed", label: "Карт", collapseMobile: true },
    { id: "k", label: "K", collapseMobile: true },
    { id: "d", label: "D", collapseMobile: true },
    { id: "kd", label: "K/D", fmt: fmt2, collapseMobile: true },
    { id: "rating", label: "Рейтинг", fmt: fmtRating },
  ];
  // На телефоне Карт/K/D/K-D-ratio прячутся как отдельные колонки, но не
  // теряются — переезжают строкой под именем игрока (см. .player-meta).

  // Вкладка "Карты": своя статистика на игрока, без рейтинга — зато с
  // раундами и разницей K-D, которых нет в REQUIRED_COLUMNS.
  var MAP_COLUMNS = [
    { id: "name", label: "Игрок" },
    { id: "totalRounds", label: "Раунды", fmt: fmtInt, collapseMobile: true },
    { id: "k", label: "K", collapseMobile: true },
    { id: "d", label: "D", collapseMobile: true },
    { id: "kdDiff", label: "K-D", fmt: fmtDiff, collapseMobile: true },
    { id: "kd", label: "K/D", fmt: fmt2, collapseMobile: true },
    { id: "winRate", label: "WR", fmt: fmtWr, collapseMobile: true },
    { id: "mapsPlayed", label: "Карт" },
  ];

  function fmt2(v) { return v == null ? "—" : v.toFixed(2); }
  function fmtInt(v) { return v == null ? "—" : String(v); }
  function fmtWr(v) { return v == null ? "—" : Math.round(v * 100) + "%"; }
  function fmtRating(v) { return v == null ? "—" : String(Math.round(v)); }
  function fmtDiff(v) { return v == null ? "—" : (v > 0 ? "+" : "") + v; }
  // Склонение по правилам русского языка: 1 карта, 2–4 карты, 5–20 карт,
  // 21 карта, 22 карты... (11–14 — всегда "карт").
  function pluralRu(n, one, few, many) {
    var m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return one;
    if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
    return many;
  }
  function mapsCount(n) { return n + " " + pluralRu(n, "карта", "карты", "карт"); }
  function fmtRatingDelta(v) { return v > 0 ? "+" + v : v < 0 ? String(v) : "+0"; }
  function ratingDeltaClass(v) { return v > 0 ? "rating-delta-up" : v < 0 ? "rating-delta-down" : "rating-delta-flat"; }

  var TAB_STORAGE_KEY = "llstat:selectedTab";
  var VALID_TABS = ["allTime", "lastSession", "draft", "matchday", "maps", "records"];
  function loadSavedTab() {
    try { return localStorage.getItem(TAB_STORAGE_KEY); } catch (err) { return null; }
  }
  function saveTab(tab) {
    try { localStorage.setItem(TAB_STORAGE_KEY, tab); } catch (err) {}
  }

  var state = {
    data: null,
    tab: VALID_TABS.indexOf(loadSavedTab()) !== -1 ? loadSavedTab() : "allTime",
    sortColumn: "rating",
    sortDirection: "desc",
    mapSortColumn: "mapsPlayed",
    mapSortDirection: "desc",
    selectedMapKey: null,
    expanded: null,
    sessionId: null,
    matchday: null,
  };

  // "За всё время"/"Сессии" используют одну общую пару
  // sortColumn/sortDirection (так исторически сложилось — переключение между
  // ними не сбрасывает сортировку). У "Карты" свой набор колонок (нет
  // "рейтинга"), поэтому своя пара с собственным дефолтом (K/D).
  function currentColumns() {
    return state.tab === "maps" ? MAP_COLUMNS : REQUIRED_COLUMNS;
  }
  function getSortColumn() {
    return state.tab === "maps" ? state.mapSortColumn : state.sortColumn;
  }
  function getSortDirection() {
    return state.tab === "maps" ? state.mapSortDirection : state.sortDirection;
  }
  function setSort(column, direction) {
    if (state.tab === "maps") {
      state.mapSortColumn = column;
      state.mapSortDirection = direction;
    } else {
      state.sortColumn = column;
      state.sortDirection = direction;
    }
  }
  function currentMapEntry() {
    var maps = (state.data && state.data.maps) || [];
    if (!maps.length) return null;
    var found = maps.filter(function (m) { return m.mapKey === state.selectedMapKey; })[0];
    return found || maps[0];
  }

  // Выбранная на вкладке "Сессии": по умолчанию (и после перезагрузки) —
  // последняя; если id не нашёлся, тоже последняя.
  function currentSession() {
    var sessions = (state.data && state.data.sessions) || [];
    if (!sessions.length) return null;
    return sessions.filter(function (s) { return s.id === state.sessionId; })[0] || sessions[0];
  }
  // id сессии — "ГГГГ-ММ-ДД" или "ГГГГ-ММ-ДД-N" (N-я сессия в тот же день).
  function sessionDate(id) {
    var m = /^(\d{4})-(\d{2})-(\d{2})(?:-(\d+))?$/.exec(id);
    return m ? m[3] + "." + m[2] + "." + m[1] + (m[4] ? " (№" + m[4] + ")" : "") : id;
  }
  function sessionLabel(s) {
    return sessionDate(s.id) + " · " + mapsCount(s.maps.length);
  }

  // GitHub Pages отдаёт data/stats.json с Cache-Control: max-age=600 — без
  // no-store обычный F5 в течение 10 минут после последнего визита получает
  // старую версию из кэша браузера, даже если на сервере уже новые цифры.
  fetch("data/stats.json", { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      state.data = data;
      render();
    })
    .catch(function (err) {
      document.getElementById("subtitle").textContent = "Не удалось загрузить data/stats.json: " + err.message;
    });

  // MatchDay лежит отдельным файлом (его пишет бот, build.mjs не трогает); файла
  // может не быть (404) — тогда вкладка показывает "вечер не запланирован".
  function loadMatchday() {
    fetch("data/matchday.json", { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .catch(function () { return null; })
      .then(function (doc) {
        state.matchday = doc;
        render();
      });
  }
  loadMatchday();

  // Тема: сохранённый выбор (llstat:theme) или системная; начальное значение ставит
  // скрипт в <head>, здесь только переключатель.
  function currentTheme() { return document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark"; }
  function updateThemeToggle() {
    var light = currentTheme() === "light";
    var btn = document.getElementById("themeToggle");
    var label = light ? "Включить тёмную тему" : "Включить светлую тему";
    btn.setAttribute("aria-label", label);
    btn.title = label;
  }
  document.getElementById("themeToggle").addEventListener("click", function () {
    var prev = currentTheme();
    var next = prev === "light" ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("llstat:theme", next); } catch (e) {}
    updateThemeToggle();
    histRemapTheme(prev, next);
  });
  updateThemeToggle();

  var tabEls = document.querySelectorAll(".tab");
  tabEls.forEach(function (tab) {
    tab.classList.toggle("active", tab.dataset.tab === state.tab);
    tab.addEventListener("click", function () {
      state.tab = tab.dataset.tab;
      state.expanded = null;
      saveTab(state.tab);
      tabEls.forEach(function (t) { t.classList.toggle("active", t === tab); });
      render();
    });
  });

  function render() {
    if (!state.data) return;
    renderSubtitle();
    renderBanner();
    renderSessionHeader();
    renderMapChips();
    renderMobileSort();
    renderTable();
    renderHistorySection();
    renderRecordsSection();
    renderFooter();
    renderDraftSection();
    renderMatchdaySection();
    renderSessionMapsSection();
  }

  function renderMapChips() {
    var el = document.getElementById("mapChips");
    if (state.tab !== "maps") { el.innerHTML = ""; return; }
    var maps = (state.data.maps || []);
    if (!maps.length) { el.innerHTML = '<div class="session-header">Карт пока нет.</div>'; return; }
    if (!maps.some(function (m) { return m.mapKey === state.selectedMapKey; })) {
      state.selectedMapKey = maps[0].mapKey;
    }
    var selected = maps.filter(function (m) { return m.mapKey === state.selectedMapKey; })[0];

    // каркас баннера строим один раз — пересоздание сбрасывало бы прокрутку
    // строки чипов на телефоне и обрывало плавную смену кадра
    var hero = el.querySelector(".map-hero");
    if (!hero) {
      el.innerHTML =
        '<div class="map-hero">' +
          '<div class="map-hero-bg"></div><div class="map-hero-bg"></div>' +
          '<div class="map-hero-content">' +
            '<div class="map-hero-title"></div>' +
            '<div class="map-hero-sub"></div>' +
            '<div class="map-chips"></div>' +
          "</div>" +
        "</div>";
      hero = el.querySelector(".map-hero");
    }

    hero.querySelector(".map-hero-title").textContent = selected.displayName;
    hero.querySelector(".map-hero-sub").textContent = "Сыграно карт: " + selected.timesPlayed;
    setMapHeroImage(hero, selected.bannerUrl);

    var chips = hero.querySelector(".map-chips");
    var chipsKey = maps.map(function (m) { return m.mapKey + ":" + m.timesPlayed; }).join(",");
    if (chips.dataset.key !== chipsKey) {
      chips.dataset.key = chipsKey;
      chips.innerHTML = maps.map(function (m) {
        var iconHtml = m.iconUrl
          ? '<img class="map-chip-icon" src="' + escapeHtml(m.iconUrl) + '" alt="" loading="lazy">'
          : "";
        return '<button type="button" class="map-chip" data-map="' + escapeHtml(m.mapKey) + '">' +
          iconHtml + escapeHtml(m.displayName) + ' <span class="map-chip-count">×' + m.timesPlayed + "</span></button>";
      }).join("");
      chips.querySelectorAll(".map-chip").forEach(function (btn) {
        btn.addEventListener("click", function () {
          state.selectedMapKey = btn.dataset.map;
          render();
        });
      });
    }
    var activeChip = null;
    chips.querySelectorAll(".map-chip").forEach(function (btn) {
      var isActive = btn.dataset.map === state.selectedMapKey;
      btn.classList.toggle("active", isActive);
      if (isActive) activeChip = btn;
    });

    // на телефоне строка чипов прокручивается — докручиваем до выбранного,
    // если он за краем (scrollIntoView дёрнул бы ещё и всю страницу)
    if (activeChip && chips.scrollWidth > chips.clientWidth) {
      var left = activeChip.offsetLeft - chips.offsetLeft;
      var right = left + activeChip.offsetWidth;
      if (left < chips.scrollLeft || right > chips.scrollLeft + chips.clientWidth) {
        chips.scrollTo({ left: Math.max(0, left - 12), behavior: "smooth" });
      }
    }
  }

  // Новый кадр кладём в скрытый слой и проявляем только после загрузки,
  // чтобы при переключении не мигал пустой баннер. Если ответ пришёл уже
  // после следующего переключения — он устарел, его игнорируем.
  function setMapHeroImage(hero, url) {
    if (hero.dataset.bannerUrl === (url || "")) return;
    hero.dataset.bannerUrl = url || "";
    var layers = hero.querySelectorAll(".map-hero-bg");
    var current = hero.querySelector(".map-hero-bg.shown");
    var next = current === layers[0] ? layers[1] : layers[0];
    if (!url) {
      if (current) current.classList.remove("shown");
      return;
    }
    var img = new Image();
    img.onload = function () {
      if (hero.dataset.bannerUrl !== url) return;
      next.style.backgroundImage = 'url("' + url + '")';
      next.classList.add("shown");
      if (current) current.classList.remove("shown");
    };
    img.src = url;
  }

  function renderMobileSort() {
    var el = document.getElementById("mobileSort");
    if (noTableTab()) { el.innerHTML = ""; return; }
    var sortCol = getSortColumn();
    var options = currentColumns().map(function (c) {
      var selected = sortCol === c.id ? " selected" : "";
      return '<option value="' + c.id + '"' + selected + ">" + escapeHtml(c.label) + "</option>";
    }).join("");
    var dirLabel = getSortDirection() === "desc" ? "↓" : "↑";
    el.innerHTML =
      '<select id="mobileSortSelect" aria-label="Сортировать по">' + options + "</select>" +
      '<button type="button" id="mobileSortDir" aria-label="Сменить направление сортировки">' + dirLabel + "</button>";

    document.getElementById("mobileSortSelect").addEventListener("change", function (e) {
      setSort(e.target.value, "desc");
      render();
    });
    document.getElementById("mobileSortDir").addEventListener("click", function () {
      setSort(getSortColumn(), getSortDirection() === "desc" ? "asc" : "desc");
      render();
    });
  }

  function renderSubtitle() {
    document.getElementById("subtitle").textContent =
      "Карт учтено: " + state.data.totalMapsCollected + " · обновлено " + formatDateTime(state.data.generatedAt);
  }

  function renderBanner() {
    var el = document.getElementById("qualBanner");
    var drop = state.data.qualification.qualificationDrop;
    if (!drop) { el.innerHTML = ""; return; }
    el.innerHTML =
      '<div class="banner">Порог квалификации вырос до ' + drop.threshold + " " + pluralRu(drop.threshold, "карты", "карт", "карт") + ' — вне рейтинга: ' +
      drop.droppedNames.map(escapeHtml).join(", ") + "</div>";
  }

  function renderSessionHeader() {
    var el = document.getElementById("sessionHeader");
    var s = currentSession();
    if (state.tab !== "lastSession" || !s) {
      el.innerHTML = state.tab === "lastSession"
        ? '<div class="session-header">Сессий пока нет.</div>'
        : "";
      el.dataset.key = "";
      return;
    }
    // Любой render() (сортировка таблицы, раскрытие строки…) вызывает и эту функцию;
    // если вкладка, сессия и состояние панели не менялись, шапку не пересобираем —
    // иначе пересоздавалась бы карточка и пропадало сообщение «Скопировано».
    var key = state.tab + "|" + s.id;
    if (el.dataset.key === key && el.firstChild) return;
    el.dataset.key = key;
    var hours = s.lastPlayedAt && s.firstPlayedAt
      ? Math.max(1, Math.round((s.lastPlayedAt - s.firstPlayedAt) / 3600))
      : null;
    var mapsHtml = s.maps.map(function (m) {
      // счёт везде записываем "победитель первым" (как на карточке и в рекордах)
      var score = m.teams && m.teams.length === 2 && m.teams[0].score != null && m.teams[1].score != null
        ? Math.max(m.teams[0].score, m.teams[1].score) + ":" + Math.min(m.teams[0].score, m.teams[1].score)
        : "";
      var tierNote = m.statsTier === "basic" ? " (basic)" : "";
      return '<a href="' + escapeHtml(m.url) + '" target="_blank" rel="noopener">' +
        escapeHtml(m.map || "?") + " " + score + tierNote + "</a>";
    }).join("");
    var optionsHtml = state.data.sessions.map(function (x) {
      return '<option value="' + escapeHtml(x.id) + '"' + (x.id === s.id ? " selected" : "") + ">" +
        escapeHtml(sessionLabel(x)) + "</option>";
    }).join("");
    el.innerHTML =
      '<div class="session-picker"><select id="sessionSelect" aria-label="Сессия">' + optionsHtml + "</select>" +
      "</div>" +
      '<div class="session-header"><span class="session-id">Сессия ' + escapeHtml(s.id) + "</span> · " +
      mapsCount(s.maps.length) + (hours ? " · ~" + hours + " ч" : "") +
      '<div class="session-maps">' + mapsHtml + "</div></div>";

    document.getElementById("sessionSelect").addEventListener("change", function (e) {
      state.sessionId = e.target.value;
      state.expanded = null;
      render();
      // render() пересоздал <select>; возвращаем фокус, иначе по сессиям нельзя
      // листать стрелками с клавиатуры.
      document.getElementById("sessionSelect").focus();
    });
  }

  function renderFooter() {
    var el = document.getElementById("footer");
    if (noTableTab()) { el.textContent = ""; return; }
    el.textContent =
      state.tab === "allTime"
        ? "Порог квалификации: " + mapsCount(state.data.qualification.threshold) + " " +
          "(" + Math.round(state.data.qualification.qualifyShare * 100) + "% от " +
          state.data.qualification.maxMaps + " у лидера)"
        : "Карт учтено всего: " + state.data.totalMapsCollected;
  }

  // Вкладки, на которых нет общей таблицы игроков (у них свой блок).
  function noTableTab() { return state.tab === "draft" || state.tab === "matchday" || state.tab === "records"; }

  function getRows() {
    if (noTableTab()) return [];
    if (state.tab === "allTime") return state.data.allTime.players;
    if (state.tab === "maps") {
      var m = currentMapEntry();
      return m ? m.players : [];
    }
    var s = currentSession();
    return s ? s.players : [];
  }

  function sortedRows() {
    var rows = getRows().slice();
    var col = getSortColumn();
    var dir = getSortDirection() === "asc" ? 1 : -1;
    // Порог квалификации считается по всей истории и не имеет смысла для
    // одной сессии из 3-7 карт — там сортируем только по колонке.
    var useQualification = state.tab === "allTime";
    // "Карты", сортировка по числу карт: при равенстве выше тот, у кого
    // лучше K/D на этой карте, а не произвольный порядок.
    var tiebreakKd = state.tab === "maps" && col === "mapsPlayed";
    rows.sort(function (a, b) {
      if (useQualification && a.isQualified !== b.isQualified) return a.isQualified ? -1 : 1;
      var av = a[col], bv = b[col];
      if (av == null && bv == null) return 0;
      if (av == null) return 1;
      if (bv == null) return -1;
      if (av !== bv) return (av < bv ? -1 : 1) * dir;
      if (tiebreakKd && a.kd !== b.kd) {
        if (a.kd == null) return 1;
        if (b.kd == null) return -1;
        return a.kd < b.kd ? 1 : -1;
      }
      return 0;
    });
    return rows;
  }

  // Абсолютные пороги (см. "Информация о рейтинге") — разные для двух вкладок,
  // потому что у них разные шкалы: сессия почти никогда не доходит до 800+,
  // "за всё время" считается вокруг базы 500.
  var SESSION_TIERS = [
    { min: 800, cls: "tier-green" },
    { min: 600, cls: "tier-yellow" },
    { min: 400, cls: "tier-orange" },
    { min: -Infinity, cls: "tier-red" },
  ];
  var ALLTIME_TIERS = [
    { min: 800, cls: "tier-green" },
    { min: 700, cls: "tier-yellow" },
    { min: 600, cls: "tier-orange" },
    { min: 500, cls: "tier-neutral" },
    { min: 400, cls: "tier-accent" },
    { min: -Infinity, cls: "tier-red" },
  ];

  function ratingClass(row) {
    if (row.rating == null) return "rating-na";
    var tiers = state.tab === "allTime" ? ALLTIME_TIERS : SESSION_TIERS;
    for (var i = 0; i < tiers.length; i++) {
      if (row.rating >= tiers[i].min) return tiers[i].cls;
    }
    return "tier-red";
  }

  function renderTable() {
    if (noTableTab()) { document.getElementById("tableWrap").innerHTML = ""; return; }
    var rows = sortedRows();
    var columns = currentColumns();
    var isMapsTab = state.tab === "maps";

    var headHtml = "<tr>";
    columns.forEach(function (c) {
      headHtml += headerCell(c);
    });
    headHtml += "</tr>";

    var bodyHtml = "";
    var thresholdShown = false;
    var showQualification = state.tab === "allTime";
    rows.forEach(function (row) {
      if (showQualification && !row.isQualified && !thresholdShown) {
        thresholdShown = true;
        bodyHtml += '<tr class="qual-divider"><td colspan="' + columns.length +
          '">менее ' + Math.round(state.data.qualification.qualifyShare * 100) +
          '% карт лидера (' + state.data.qualification.threshold + ')</td></tr>';
      }
      bodyHtml += isMapsTab ? mapRowHtml(row) : playerRowHtml(row, showQualification);
      bodyHtml += detailRowHtml(row);
    });

    document.getElementById("tableWrap").innerHTML =
      "<table><thead>" + headHtml + "</thead><tbody>" + bodyHtml + "</tbody></table>";

    document.querySelectorAll("thead th[data-sort]").forEach(function (th) {
      th.addEventListener("click", function () {
        var col = th.dataset.sort;
        if (getSortColumn() === col) {
          setSort(col, getSortDirection() === "desc" ? "asc" : "desc");
        } else {
          setSort(col, "desc");
        }
        render();
      });
    });

    document.querySelectorAll("tr.player-row").forEach(function (tr) {
      tr.addEventListener("click", function () {
        var id = tr.dataset.steamid;
        state.expanded = state.expanded === id ? null : id;
        render();
      });
    });
  }

  function headerCell(c) {
    var sorted = getSortColumn() === c.id ? "sorted" : "";
    var cls = (c.collapseMobile ? "req-collapse " : "") + sorted;
    return '<th class="' + cls + '" data-sort="' + c.id + '">' + escapeHtml(c.label) + "</th>";
  }

  // Ссылка на профиль Steam — только на вкладке "За всё время"; на остальных
  // (сессия, карты) ник просто текст, без гиперссылки.
  function playerCellHtml(row, metaText, linked) {
    var avatarHtml = row.avatarUrl
      ? '<img class="avatar" src="' + escapeHtml(row.avatarUrl) + '" alt="" loading="lazy">'
      : '<div class="avatar"></div>';
    var inner = avatarHtml + '<span class="player-text">' +
      '<span class="player-name">' + escapeHtml(row.name) + "</span>" +
      '<span class="player-meta">' + metaText + "</span>" +
      "</span>";
    if (linked) {
      inner = '<a href="' + escapeHtml(row.steamProfileUrl) + '" target="_blank" rel="noopener" onclick="event.stopPropagation()">' +
        inner + "</a>";
    }
    return '<td><div class="player-cell">' + inner + "</div></td>";
  }

  function playerRowHtml(row, showQualification) {
    var isUnqualified = showQualification && !row.isQualified;
    var cls = "player-row" + (isUnqualified ? " unqualified" : "");
    var mapsCell = !isUnqualified
      ? row.mapsPlayed
      : row.mapsPlayed + ' <small>/ ' + state.data.qualification.threshold + "</small>";

    var metaText = mapsCount(row.mapsPlayed) + " · K " + row.k + " - D " + row.d + " · K/D " + fmt2(row.kd);

    var cells = "";
    cells += playerCellHtml(row, metaText, state.tab === "allTime");
    cells += '<td class="maps-cell req-collapse">' + mapsCell + "</td>";
    cells += '<td class="req-collapse">' + row.k + "</td>";
    cells += '<td class="req-collapse">' + row.d + "</td>";
    cells += '<td class="req-collapse">' + fmt2(row.kd) + "</td>";
    var ratingHtml = '<span class="rating-cell ' + ratingClass(row) + '">' + fmtRating(row.rating) + "</span>";
    if (state.tab === "allTime" && row.ratingDelta != null) {
      ratingHtml = '<span class="rating-with-delta">' +
        '<span class="rating-delta ' + ratingDeltaClass(row.ratingDelta) + '">' + fmtRatingDelta(row.ratingDelta) + "</span>" +
        ratingHtml + "</span>";
    }
    cells += "<td>" + ratingHtml + "</td>";

    return '<tr class="' + cls + '" data-steamid="' + row.steamid64 + '">' + cells + "</tr>";
  }

  // Вкладка "Карты": на десктопе все метрики уже отдельными колонками, но на
  // мобильном часть (К-D, WR) прячется — кликабельна, как остальные вкладки,
  // чтобы на телефоне эти цифры тоже были доступны через detailRowHtml.
  function mapRowHtml(row) {
    var metaText = fmtInt(row.totalRounds) + " раундов · K " + row.k + " - D " + row.d + " · K/D " + fmt2(row.kd);
    var cells = playerCellHtml(row, metaText, false);

    MAP_COLUMNS.slice(1).forEach(function (c) {
      var value = row[c.id];
      var text = c.fmt ? c.fmt(value) : String(value);
      var cls = c.collapseMobile ? "req-collapse" : "";
      cells += '<td class="' + cls + '">' + text + "</td>";
    });

    return '<tr class="player-row" data-steamid="' + row.steamid64 + '">' + cells + "</tr>";
  }

  function detailRowHtml(row) {
    var expanded = state.expanded === row.steamid64;
    var colspan = currentColumns().length;
    if (!expanded) {
      return '<tr class="detail-row" hidden><td colspan="' + colspan + '"></td></tr>';
    }

    var metrics = [
      ["Раунды", fmtInt(row.totalRounds)],
      ["K-D (разница)", fmtDiff(row.k - row.d)],
      ["WR", fmtWr(row.winRate) + " (" + row.wins + "-" + row.losses + ")"],
    ];
    var metricsHtml = metrics.map(function (m) {
      return '<div class="detail-metric"><div class="label">' + m[0] + '</div><div class="value">' + m[1] + "</div></div>";
    }).join("");

    return '<tr class="detail-row"><td colspan="' + colspan + '">' +
      '<div class="detail-grid">' + metricsHtml + "</div></td></tr>";
  }

  // "Динамика рейтинга": линейный график рейтинга "за всё время" по сессиям,
  // до HIST_MAX игроков для сравнения (вкладка "За всё время", под таблицей).
  // Цвета — 6 слотов палитры dataviz, проверенные валидатором: тёмная против
  // фона панели (#1b1e26), светлая против белой панели (#ffffff; три слота
  // ниже 3:1 по контрасту — это допустимо, потому что есть чипы-легенда,
  // подсказка и таблица значений). Цвет принадлежит игроку, пока он выбран;
  // при смене темы слот тот же, меняется только оттенок.
  var HIST_PALETTES = {
    dark: ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#008300"],
    light: ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300"],
  };
  function histPalette() { return HIST_PALETTES[currentTheme()]; }
  function histRemapTheme(prev, next) {
    var from = HIST_PALETTES[prev], to = HIST_PALETTES[next];
    histState.selected.forEach(function (sel) {
      var i = from.indexOf(sel.color);
      if (i !== -1) sel.color = to[i];
    });
    if (histState.ready) { renderHistChips(); drawHistChart(); }
  }
  var HIST_MAX = 6;
  var HIST_DEFAULT = 3;
  var SVG_NS = "http://www.w3.org/2000/svg";
  var histState = { ready: false, selected: [] }; // selected: [{ id, color }]

  function svgEl(name, attrs, style) {
    var el = document.createElementNS(SVG_NS, name);
    for (var k in attrs) el.setAttribute(k, attrs[k]);
    if (style) el.setAttribute("style", style);
    return el;
  }
  // Подписи сессий для оси X и шапки таблицы: "ДД.ММ"; если данные охватывают
  // несколько лет — у всех добавляется год ("ДД.ММ.ГГ"), чтобы подписи не
  // двоились; 2-я и следующие сессии одного дня получают суффикс " №N".
  function histLabels(sessions) {
    var years = {};
    sessions.forEach(function (s) { years[s.id.slice(0, 4)] = true; });
    var multiYear = Object.keys(years).length > 1;
    return sessions.map(function (s) {
      var m = /^(\d{4})-(\d{2})-(\d{2})(?:-(\d+))?$/.exec(s.id);
      if (!m) return s.id;
      return m[3] + "." + m[2] + (multiYear ? "." + m[1].slice(2) : "") + (m[4] ? " №" + m[4] : "");
    });
  }
  // Ось Y: округлённые границы и шаг, не более ~5 делений.
  function histYScale(values) {
    var lo = Math.min.apply(null, values.concat([500]));
    var hi = Math.max.apply(null, values.concat([500]));
    var span = Math.max(hi - lo, 50);
    // шаг считаем по диапазону вместе с запасом по краям (+16%), иначе делений выходит больше 5
    var step = [10, 25, 50, 100, 200, 250, 500].filter(function (s) { return span * 1.16 / s <= 5; })[0] || 500;
    return {
      min: Math.max(0, Math.floor((lo - span * 0.08) / step) * step),
      max: Math.ceil((hi + span * 0.08) / step) * step,
      step: step,
    };
  }
  function histPlayers() {
    var h = state.data.ratingHistory;
    return state.data.allTime.players.filter(function (p) { return h.players[p.steamid64]; });
  }
  // В какие сессии игрок реально играл (по списку игроков каждой сессии).
  function histPlayedIn() {
    var played = {};
    (state.data.sessions || []).forEach(function (s) {
      played[s.id] = {};
      s.players.forEach(function (p) { played[s.id][p.steamid64] = true; });
    });
    return played;
  }

  function renderHistorySection() {
    var el = document.getElementById("historySection");
    var h = state.data && state.data.ratingHistory;
    if (state.tab !== "allTime" || !h || !h.sessions.length) { el.style.display = "none"; return; }
    el.style.display = "";
    if (!histState.ready) {
      histState.selected = histPlayers()
        .filter(function (p) { return p.isQualified; })
        .slice(0, HIST_DEFAULT)
        .map(function (p, i) { return { id: p.steamid64, color: histPalette()[i] }; });
      el.innerHTML =
        '<div class="hist-section">' +
          '<div class="hist-title">Динамика рейтинга</div>' +
          '<div class="hist-chips" id="histChips"></div>' +
          '<div class="hist-hint" id="histHint" aria-live="polite"></div>' +
          '<div class="hist-chart" id="histChart"></div>' +
          '<details class="hist-table-wrap"><summary>Таблица значений</summary>' +
            '<div class="hist-table-scroll" id="histTable"></div></details>' +
        "</div>";
      // На телефоне resize приходит и при показе/скрытии адресной строки (меняется
      // только высота) — перерисовываем, только когда изменилась ширина графика.
      window.addEventListener("resize", function () {
        var box = document.getElementById("histChart");
        if (state.tab !== "allTime" || !box || box.clientWidth === histState.drawnWidth) return;
        drawHistChart();
      });
      histState.ready = true;
    }
    renderHistChips();
    drawHistChart();
  }

  function renderHistChips() {
    var box = document.getElementById("histChips");
    box.textContent = "";
    histPlayers().forEach(function (p) {

      var dot = document.createElement("span");
      dot.className = "hist-chip-dot";
      if (sel) dot.style.background = sel.color;

  function toggleHistPlayer(id) {
    var hint = document.getElementById("histHint");
    var idx = -1;
    histState.selected.forEach(function (s, i) { if (s.id === id) idx = i; });
    hint.textContent = "";
    if (idx !== -1) {
      histState.selected.splice(idx, 1);
    } else {
      if (histState.selected.length >= HIST_MAX) {
        hint.textContent = "Максимум " + HIST_MAX + " игроков — сначала снимите кого-нибудь.";
        return;
      }
      var used = histState.selected.map(function (s) { return s.color; });
      var color = histPalette().filter(function (c) { return used.indexOf(c) === -1; })[0];
      histState.selected.push({ id: id, color: color });
    }
    renderHistChips();
    drawHistChart();
  }

  function drawHistChart() {
    var box = document.getElementById("histChart");
    if (!box || state.tab !== "allTime") return;
    histState.drawnWidth = box.clientWidth;
    var h = state.data.ratingHistory;
    var names = {};
    state.data.allTime.players.forEach(function (p) { names[p.steamid64] = p.name; });
    var sel = histState.selected;
    box.textContent = "";
    drawHistTable(sel, names);
    if (!sel.length) {
      var empty = document.createElement("div");
      empty.className = "hist-empty";
      empty.textContent = "Выберите игроков, чтобы сравнить их рейтинг";
      box.appendChild(empty);
      return;
    }

    var n = h.sessions.length;
    var width = box.clientWidth || 600;
    var height = width < 480 ? 240 : 280;
    var padL = 40, padR = 14, padT = 12, padB = 26, inner = 10;
    var values = [];
    sel.forEach(function (s) {
      h.players[s.id].forEach(function (v) { if (v !== null) values.push(v); });
    });
    var ys = histYScale(values);
    var plotW = width - padL - padR - inner * 2;
    function xAt(i) { return padL + inner + (n === 1 ? plotW / 2 : i * plotW / (n - 1)); }
    function yAt(v) { return padT + (ys.max - v) / (ys.max - ys.min) * (height - padT - padB); }

    var svg = svgEl("svg", { width: width, height: height, viewBox: "0 0 " + width + " " + height, role: "img", tabindex: "0",
      "aria-label": "График рейтинга по сессиям; стрелки влево и вправо переключают сессии" });

    for (var t = ys.min; t <= ys.max; t += ys.step) {
      svg.appendChild(svgEl("line", { x1: padL, x2: width - padR, y1: yAt(t), y2: yAt(t) }, "stroke: var(--border); stroke-width: 1;"));
      var tl = svgEl("text", { x: padL - 6, y: yAt(t) + 4, "text-anchor": "end" }, "fill: var(--text-faint); font-size: 11px;");
      tl.textContent = String(t);
      svg.appendChild(tl);
    }
    if (500 >= ys.min && 500 <= ys.max) {
      svg.appendChild(svgEl("line", { x1: padL, x2: width - padR, y1: yAt(500), y2: yAt(500) },
        "stroke: var(--text-faint); stroke-width: 1; opacity: 0.7;"));
      var ref = svgEl("text", { x: width - padR, y: yAt(500) - 4, "text-anchor": "end" }, "fill: var(--text-faint); font-size: 11px;");
      ref.textContent = "500 — средний игрок";
      svg.appendChild(ref);
    }

    // подписи оси X: не чаще, чем помещаются, последняя сессия всегда подписана
    var labels = histLabels(h.sessions);
    var maxLen = Math.max.apply(null, labels.map(function (l) { return l.length; }));
    var labelWidth = Math.max(44, maxLen * 6 + 14); // ~6px на символ при 11px шрифте
    var every = Math.max(1, Math.ceil(n * labelWidth / (width - padL - padR)));
    h.sessions.forEach(function (s, i) {
      if ((n - 1 - i) % every !== 0) return;
      var xl = svgEl("text", { x: xAt(i), y: height - 8, "text-anchor": "middle" }, "fill: var(--text-faint); font-size: 11px;");
      xl.textContent = labels[i];
      svg.appendChild(xl);
    });

    var played = histPlayedIn();
    sel.forEach(function (s) {
      var arr = h.players[s.id];
      var d = "";
      arr.forEach(function (v, i) {
        if (v === null) return;
        d += (d ? " L" : "M") + xAt(i).toFixed(1) + " " + yAt(v).toFixed(1);
      });
      if (d.indexOf("L") !== -1) {
        svg.appendChild(svgEl("path", { d: d }, "fill: none; stroke: " + s.color + "; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;"));
      }
      arr.forEach(function (v, i) {
        if (v === null || !(played[h.sessions[i].id] && played[h.sessions[i].id][s.id])) return;
        svg.appendChild(svgEl("circle", { cx: xAt(i), cy: yAt(v), r: 4 },
          "fill: " + s.color + "; stroke: var(--bg-panel); stroke-width: 2;"));
      });
    });

    var guide = svgEl("line", { x1: 0, x2: 0, y1: padT, y2: height - padB }, "stroke: var(--text-faint); stroke-width: 1; display: none;");
    svg.appendChild(guide);
    var hit = svgEl("rect", { x: padL, y: 0, width: width - padL - padR, height: height }, "fill: transparent;");
    svg.appendChild(hit);
    box.appendChild(svg);

    var tip = document.createElement("div");
    tip.className = "hist-tip";
    tip.style.display = "none";
    box.appendChild(tip);

    function showAt(i) {
      var rows = sel.map(function (s) {
        return { color: s.color, name: names[s.id] || s.id, value: h.players[s.id][i] };
      }).sort(function (a, b) { return (b.value === null ? -1 : b.value) - (a.value === null ? -1 : a.value); });
      tip.textContent = "";
      var head = document.createElement("div");
      head.className = "hist-tip-head";
      head.textContent = sessionDate(h.sessions[i].id);
      tip.appendChild(head);
      rows.forEach(function (r) {
        var row = document.createElement("div");
        row.className = "hist-tip-row";
        var key = document.createElement("span");
        key.className = "hist-tip-key";
        key.style.background = r.color;
        var nm = document.createElement("span");
        nm.className = "hist-tip-name";
        nm.textContent = r.name;
        var val = document.createElement("span");
        val.className = "hist-tip-val";
        val.textContent = r.value === null ? "—" : String(r.value);
        row.appendChild(key);
        row.appendChild(nm);
        row.appendChild(val);
        tip.appendChild(row);
      });
      guide.setAttribute("x1", xAt(i));
      guide.setAttribute("x2", xAt(i));
      guide.style.display = "";
      tip.style.display = "";
      var left = xAt(i) + 12;
      if (left + tip.offsetWidth > width) left = xAt(i) - 12 - tip.offsetWidth;
      tip.style.left = Math.max(0, Math.min(left, width - tip.offsetWidth)) + "px";
      tip.style.top = padT + "px";
    }
    function hide() {
      guide.style.display = "none";
      tip.style.display = "none";
    }
    function nearest(clientX) {
      var rect = svg.getBoundingClientRect();
      var x = (clientX - rect.left) * (width / rect.width);
      var best = 0;
      for (var i = 1; i < n; i++) if (Math.abs(xAt(i) - x) < Math.abs(xAt(best) - x)) best = i;
      return best;
    }
    var cursor = n - 1;
    hit.addEventListener("pointermove", function (e) { cursor = nearest(e.clientX); showAt(cursor); });
    hit.addEventListener("pointerdown", function (e) { cursor = nearest(e.clientX); showAt(cursor); });
    // У касания pointerleave приходит сразу после pointerup, поэтому прячем
    // только при уходе мыши; на телефоне подсказка живёт до blur (тап мимо графика).
    svg.addEventListener("pointerleave", function (e) { if (e.pointerType === "mouse") hide(); });
    svg.addEventListener("focus", function () { showAt(cursor); });
    svg.addEventListener("blur", hide);
    svg.addEventListener("keydown", function (e) {
      if (e.key === "ArrowLeft") cursor = Math.max(0, cursor - 1);
      else if (e.key === "ArrowRight") cursor = Math.min(n - 1, cursor + 1);
      else return;
      e.preventDefault();
      showAt(cursor);
    });
  }

  // Вкладка "Рекорды": карточки по четырём группам, у каждого рекорда топ-3
  // (данные считает scripts/lib/records.mjs). Всё из данных — через textContent.
  var RECORD_GROUPS = [
    { id: "personal", title: "Личные рекорды" },
    { id: "streaks", title: "Серии" },
    { id: "matches", title: "Матчи" },
    { id: "oops", title: "Бывает с каждым" },
  ];

  function formatDay(sec) {
    if (sec == null) return "—";
    return new Date(sec * 1000).toLocaleDateString("ru-RU", { timeZone: "Europe/Samara" });
  }
  function recordMapName(mapKey) {
    var m = ((state.data && state.data.maps) || []).filter(function (x) { return x.mapKey === mapKey; })[0];
    return m ? m.displayName : (mapKey || "—");
  }
  function recordValueText(rec, e) {
    switch (rec.id) {
      case "most-kills": return e.value + " " + pluralRu(e.value, "убийство", "убийства", "убийств");
      case "best-kd-diff": case "carry-in-loss": case "worst-kd-diff": return fmtDiff(e.value);
      case "best-kd": case "worst-kd": return e.value.toFixed(2);
      case "most-deaths": return e.value + " " + pluralRu(e.value, "смерть", "смерти", "смертей");
      case "win-streak": case "kd-streak": case "loss-streak": return mapsCount(e.value);
      case "attendance-streak": return e.value + " " + pluralRu(e.value, "сессия", "сессии", "сессий");
      case "biggest-win": case "closest-match": return e.score[0] + ":" + e.score[1];
      case "longest-map": case "shortest-map":
        return e.rounds + " " + pluralRu(e.rounds, "раунд", "раунда", "раундов");
      default: // рекорд, которого страница ещё не знает: показываем, что есть в записи
        if (e.value != null) return String(e.value);
        if (e.score) return e.score[0] + ":" + e.score[1];
        return "—";
    }
  }
  // Подпись под строкой: серия — период, личный рекорд — карта · дата · K/D, матч — дата и раунды/счёт.
  function recordContextText(rec, e) {
    if (e.from !== undefined) {
      var a = formatDay(e.from), b = formatDay(e.to);
      return a === b ? a : a + " – " + b;
    }
    var bits = [recordMapName(e.map), formatDay(e.playedAt)];
    if (e.k !== undefined) bits.push("K " + e.k + " / D " + e.d);
    else if (rec.id === "longest-map" || rec.id === "shortest-map") bits.push("счёт " + e.score[0] + ":" + e.score[1]);
    else bits.push(e.rounds + " " + pluralRu(e.rounds, "раунд", "раунда", "раундов"));
    return bits.join(" · ");
  }

  function buildRecordRow(rec, e, place, playersById) {
    var row = document.createElement("div");

    if (e.steamid64) {
      if (player && player.avatarUrl) {

        img.className = "avatar";
        img.alt = "";
        img.loading = "lazy";
        img.src = player.avatarUrl;
        who.appendChild(img);
      }
      var nameEl = document.createElement("span");
      nameEl.textContent = player ? player.name : e.steamid64;
      who.appendChild(nameEl);
    } else {
      var mapEl = document.createElement("span");
      mapEl.textContent = recordMapName(e.map);
      who.appendChild(mapEl);
    }
    var value = document.createElement("span");
    value.className = "record-value";
    value.textContent = recordValueText(rec, e);
    var ctx = document.createElement("div");
    ctx.className = "record-context";
    ctx.appendChild(document.createTextNode(recordContextText(rec, e)));

      ctx.appendChild(document.createTextNode(" · "));

      link.href = e.url;
      link.target = "_blank";
      link.rel = "noopener";
      link.textContent = "матч";
      ctx.appendChild(link);

    row.appendChild(placeEl);
    row.appendChild(who);
    row.appendChild(value);
    row.appendChild(ctx);

  // Гости (игроки со стороны): минимум DRAFT_MIN_POOL человек из пула, остальные
  // до десяти — гости с именем и "рейтингом на глаз". У гостей нет K/D и K-D,
  // поэтому их оцениваем линейной регрессией по рейтингу на всех игроках
  // "за всё время" (draftEstimator); сами оценённые числа на экран не выводим.
  //
  // "Выбор составов": делит ровно 10 человек на два состава 5×5,
  // минимизируя разницу между командами сразу по трём сигналам — рейтингу
  // "за всё время" (вес 0.3), суммарной K-D разнице (вес 0.3) и K/D (вес 0.4),
  // каждый нормирован к своему разбросу среди выбранной десятки (иначе
  // рейтинг, у которого диапазон в сотни, забил бы K/D с диапазоном порядка
  // 1-2 — та же ошибка, что мы уже правили в весах рейтинга сессии). С 10
  // игроками всего 126 уникальных разбиений 5/5 (C(10,5)/2) — перебираем все,
  // без всякой эвристики, и берём точный оптимум.
  var DRAFT_MAX = 10;
  var DRAFT_GEN_PREFIX = "llstat:draftGen:";
  var DRAFT_MIN_POOL = 4;
  var DRAFT_GUEST_NAME_MAX = 40;
  var DRAFT_RATING_MIN = 1;
  var DRAFT_RATING_MAX = 1500;
  var DRAFT_GUEST_DEFAULT_RATING = 500;
  var draftState = { selected: new Set(), guests: [], nextGuestId: 1, lastKey: null, lastSplits: null, currentView: 0, work: null };

  function draftGuestRatingValid(g) {
    return g.rating !== "" && isFinite(Number(g.rating)) &&
      Number(g.rating) >= DRAFT_RATING_MIN && Number(g.rating) <= DRAFT_RATING_MAX;
  }

  function draftGuestWord(n) {
    return pluralRu(n, "гость", "гостя", "гостей");
  }

  function draftKeyFor(ids, guests) {
    var guestPart = guests.map(function (g) { return "g:" + g.name + "=" + g.rating; }).sort();
    return DRAFT_GEN_PREFIX + ids.slice().sort().concat(guestPart).join(",");
  }

  // y ≈ a + b·x по методу наименьших квадратов; при нулевом разбросе x — среднее y.
  function linFit(xs, ys) {
    var n = xs.length;
    var mx = xs.reduce(function (s, v) { return s + v; }, 0) / n;
    var my = ys.reduce(function (s, v) { return s + v; }, 0) / n;
    var sxx = 0, sxy = 0;
    for (var i = 0; i < n; i++) {
      sxx += (xs[i] - mx) * (xs[i] - mx);
      sxy += (xs[i] - mx) * (ys[i] - my);
    }
    var b = sxx > 0 ? sxy / sxx : 0;
    return { a: my - b * mx, b: b };
  }

  function draftEstimator(allPlayers) {
    var pool = allPlayers.filter(function (p) {
      return p.rating != null && p.kd != null && p.k != null && p.d != null;
    });
    var ratings = pool.map(function (p) { return p.rating; });
    var kdFit = linFit(ratings, pool.map(function (p) { return p.kd; }));
    var diffFit = linFit(ratings, pool.map(function (p) { return p.k - p.d; }));
    return function (rating) {
      return {
        kd: Math.max(0, kdFit.a + kdFit.b * rating),
        kdDiff: diffFit.a + diffFit.b * rating,
      };
    };
  }
  function loadDraftGenCount(key) {
    try { return parseInt(localStorage.getItem(key), 10) || 0; } catch (err) { return 0; }
  }
  function saveDraftGenCount(key, n) {
    try { localStorage.setItem(key, String(n)); } catch (err) {}
  }

  function renderDraftSection() {
    var el = document.getElementById("draftSection");
    if (el.dataset.built !== "1") {
      buildDraft(el);
      el.dataset.built = "1";
    }
