  }

  function buildDraft(el) {
    var players = state.data.allTime.players.slice().sort(function (a, b) {
      return a.name.localeCompare(b.name, "ru");
    });

    var rowsHtml = players.map(function (p) {
      var avatarHtml = p.avatarUrl
        ? '<img class="avatar" src="' + escapeHtml(p.avatarUrl) + '" alt="" loading="lazy">'
        : '<div class="avatar"></div>';
      return '<label class="draft-row">' +
        '<input type="checkbox" data-steamid="' + escapeHtml(p.steamid64) + '">' +
        avatarHtml +
        '<span class="draft-name">' + escapeHtml(p.name) + "</span>" +
        '<span class="draft-meta">рейтинг ' + fmtRating(p.rating) + " · K/D " + fmt2(p.kd) + "</span>" +
        "</label>";
    }).join("");

    el.innerHTML =
      '<div class="draft-section">' +
        '<p class="draft-hint">Выбери 10 игроков: минимум ' + DRAFT_MIN_POOL + " из нашего списка, остальных добавь " +
        "гостями с именем и примерным рейтингом. Поделим на два состава 5×5 максимально балансово " +
        "по рейтингу, K-D и K/D (у гостей K-D и K/D оцениваются по рейтингу).</p>" +
        '<div class="draft-list" id="draftList">' + rowsHtml + "</div>" +
        '<div class="draft-guests">' +
          '<button type="button" class="draft-guest-add" id="draftGuestAddBtn">+ Добавить гостя</button>' +
          '<div id="draftGuestList"></div>' +
        "</div>" +
        '<div class="draft-toolbar">' +
          '<div class="draft-counter" id="draftCounter">Выбрано: 0 / ' + DRAFT_MAX + "</div>" +
          '<button type="button" class="draft-clear-btn" id="draftClearBtn">Очистить всё</button>' +
        "</div>" +
        '<button type="button" class="wheel-spin-btn" id="draftFormBtn" disabled>Сформировать состав</button>' +
        '<div id="draftResult"></div>' +
        '<div class="draft-pin" id="draftMaps">' +
          "<h4>Порядок карт</h4>" +
          '<button type="button" class="wheel-spin-btn" id="draftMapsBtn">Определить порядок карт</button>' +
          '<div id="draftMapsRoute"></div>' +
          '<div id="draftMapsActions" hidden>' +
            '<div class="draft-variant-note">Черновик: виден только тебе, пока не отправишь команду боту.</div>' +
            '<button type="button" class="wheel-spin-btn" id="draftCopyMapsBtn">Копировать команду для карт</button> ' +
            '<a class="draft-link" href="' + BOT_URL + '" target="_blank" rel="noopener">Открыть бота</a>' +
            '<div class="draft-variant-note" id="draftMapsMsg"></div>' +
            '<textarea class="draft-cmd" id="draftMapsCmdText" readonly hidden rows="2"></textarea>' +
            '<div class="draft-variant-note">Вставь команду в чат с ботом. Дату сессии можно дописать после /maps: ДД.ММ.ГГГГ.</div>' +
          "</div>" +
        "</div>" +
      "</div>";

    el.querySelectorAll('#draftList input[type="checkbox"]').forEach(function (cb) {
      cb.addEventListener("change", onDraftCheckboxChange);
    });
    document.getElementById("draftFormBtn").addEventListener("click", function () {
      runDraft(false);
    });
    document.getElementById("draftClearBtn").addEventListener("click", clearDraftSelection);
    document.getElementById("draftGuestAddBtn").addEventListener("click", addDraftGuest);
    document.getElementById("draftGuestList").addEventListener("input", onDraftGuestInput);
    document.getElementById("draftGuestList").addEventListener("click", onDraftGuestClick);
    wireDraftMaps();
    updateDraftCounter();
  }

  function addDraftGuest() {
    var total = draftState.selected.size + draftState.guests.length;
    if (total >= DRAFT_MAX || draftState.guests.length >= DRAFT_MAX - DRAFT_MIN_POOL) return;
    draftState.guests.push({ id: draftState.nextGuestId++, name: "", rating: String(DRAFT_GUEST_DEFAULT_RATING) });
    renderDraftGuests();
    updateDraftCounter();
    document.getElementById("draftResult").innerHTML = "";
    var inputs = document.querySelectorAll("#draftGuestList .draft-guest-name");
    inputs[inputs.length - 1].focus();
  }

  function renderDraftGuests() {
    document.getElementById("draftGuestList").innerHTML = draftState.guests.map(function (g, i) {
      return '<div class="draft-guest-row" data-gid="' + g.id + '">' +
        '<input type="text" class="draft-guest-name" maxlength="' + DRAFT_GUEST_NAME_MAX + '"' +
          ' placeholder="Гость ' + (i + 1) + ': имя / плюс от…" value="' + escapeHtml(g.name) + '">' +
        '<input type="number" class="draft-guest-rating' + (draftGuestRatingValid(g) ? "" : " invalid") + '"' +
          ' min="' + DRAFT_RATING_MIN + '" max="' + DRAFT_RATING_MAX + '" step="1" value="' + escapeHtml(g.rating) + '">' +
        '<button type="button" class="draft-guest-remove" aria-label="Удалить гостя">×</button>' +
        '<div class="draft-guest-label">Рейтинг на глаз, ' + DRAFT_RATING_MIN + "–" + DRAFT_RATING_MAX +
          " (" + DRAFT_GUEST_DEFAULT_RATING + " — средний игрок)</div>" +
      "</div>";
    }).join("");
  }

  function findDraftGuest(target) {
    var row = target.closest(".draft-guest-row");
    var id = row ? Number(row.dataset.gid) : null;
    return draftState.guests.find(function (g) { return g.id === id; });
  }

  function onDraftGuestInput(e) {
    var g = findDraftGuest(e.target);
    if (!g) return;
    if (e.target.classList.contains("draft-guest-name")) {
      g.name = e.target.value;
    } else {
      g.rating = e.target.value;
      e.target.classList.toggle("invalid", !draftGuestRatingValid(g));
    }
    updateDraftCounter();
    document.getElementById("draftResult").innerHTML = "";
  }

  function onDraftGuestClick(e) {
    if (!e.target.classList.contains("draft-guest-remove")) return;
    var g = findDraftGuest(e.target);
    draftState.guests = draftState.guests.filter(function (x) { return x !== g; });
    renderDraftGuests();
    updateDraftCounter();
    document.getElementById("draftResult").innerHTML = "";
  }

  function clearDraftSelection() {
    draftState.selected.clear();
    draftState.guests = [];
    renderDraftGuests();
    document.querySelectorAll('#draftList input[type="checkbox"]').forEach(function (cb) {
      cb.checked = false;
      cb.disabled = false;
    });
    updateDraftCounter();
    document.getElementById("draftResult").innerHTML = "";
  }

  function onDraftCheckboxChange(e) {
    var id = e.target.dataset.steamid;
    if (e.target.checked) {
      if (draftState.selected.size + draftState.guests.length >= DRAFT_MAX) {
        e.target.checked = false;
        return;
      }
      draftState.selected.add(id);
    } else {
      draftState.selected.delete(id);
    }
    updateDraftCounter();
    document.getElementById("draftResult").innerHTML = "";
  }

  function updateDraftCounter() {
    var pool = draftState.selected.size;
    var guests = draftState.guests.length;
    var n = pool + guests;
    var counter = document.getElementById("draftCounter");
    counter.textContent = guests
      ? "Выбрано: " + pool + " из списка + " + guests + " " + draftGuestWord(guests) + " = " + n + " / " + DRAFT_MAX
      : "Выбрано: " + n + " / " + DRAFT_MAX;
    counter.classList.toggle("full", n === DRAFT_MAX);
    document.getElementById("draftFormBtn").disabled = !draftReady();

    var atMax = n >= DRAFT_MAX;
    document.querySelectorAll('#draftList input[type="checkbox"]').forEach(function (cb) {
      if (!cb.checked) cb.disabled = atMax;
    });
    document.getElementById("draftGuestAddBtn").disabled = atMax || guests >= DRAFT_MAX - DRAFT_MIN_POOL;
  }

  function draftReady() {
    return draftState.selected.size >= DRAFT_MIN_POOL &&
      draftState.selected.size + draftState.guests.length === DRAFT_MAX &&
      draftState.guests.every(draftGuestRatingValid);
  }

  function draftAvgOf(list, accessor) {
    var get = typeof accessor === "function" ? accessor : function (p) { return p[accessor]; };
    return list.reduce(function (sum, p) { return sum + get(p); }, 0) / list.length;
  }

  function computeDraftSplits(players) {
    var ratings = players.map(function (p) { return p.rating; });
    var kdDiffs = players.map(function (p) { return p.k - p.d; });
    var kds = players.map(function (p) { return p.kd; });
    var ratingRange = Math.max.apply(null, ratings) - Math.min.apply(null, ratings);
    var kdDiffRange = Math.max.apply(null, kdDiffs) - Math.min.apply(null, kdDiffs);
    var kdRange = Math.max.apply(null, kds) - Math.min.apply(null, kds);

    var splits = [];
    for (var mask = 1; mask < 1024; mask += 2) { // нечётные маски: players[0] всегда в teamA
      var bits = 0;
      for (var b = 0; b < 10; b++) if (mask & (1 << b)) bits++;
      if (bits !== 5) continue;

      var teamA = [], teamB = [];
      for (var i = 0; i < 10; i++) (mask & (1 << i) ? teamA : teamB).push(players[i]);

      var avgA = draftAvgOf(teamA, "rating"), avgB = draftAvgOf(teamB, "rating");
      var kdA = draftAvgOf(teamA, "kd"), kdB = draftAvgOf(teamB, "kd");
      var diffA = draftAvgOf(teamA, function (p) { return p.k - p.d; }), diffB = draftAvgOf(teamB, function (p) { return p.k - p.d; });
      var ratingDiff = Math.abs(avgA - avgB);
      var kdDiff = Math.abs(kdA - kdB);
      var kdDiffDiff = Math.abs(diffA - diffB);
      var score = 0.3 * (ratingRange > 0 ? ratingDiff / ratingRange : 0) +
                  0.3 * (kdDiffRange > 0 ? kdDiffDiff / kdDiffRange : 0) +
                  0.4 * (kdRange > 0 ? kdDiff / kdRange : 0);

      splits.push({
        teamA: teamA, teamB: teamB, avgA: avgA, avgB: avgB, kdA: kdA, kdB: kdB,
        diffA: diffA, diffB: diffB, ratingDiff: ratingDiff, kdDiff: kdDiff, kdDiffDiff: kdDiffDiff, score: score,
      });
    }
    splits.sort(function (a, b) { return a.score - b.score; });
    return splits;
  }

  // Оба варианта (лучший и второй по качеству) считаются один раз и кэшируются
  // в draftState — переключение между ними после этого бесплатное и не тратит
  // лимит генераций, лимит защищает только от появления третьего варианта.
  function runDraft(isAgain) {
    if (!draftReady()) return;
    var ids = Array.from(draftState.selected);
    var guests = draftState.guests.map(function (g, i) {
      return { name: g.name.trim() || "Гость " + (i + 1), rating: Number(g.rating) };
    });
    var key = draftKeyFor(ids, guests);
    var used = loadDraftGenCount(key);

    if (isAgain) {
      if (used < 2) saveDraftGenCount(key, 2);
      showDraftVariant(1);
      return;
    }

    if (draftState.lastKey !== key) {
      var allPlayers = state.data.allTime.players;
      var players = ids.map(function (id) {
        return allPlayers.find(function (p) { return p.steamid64 === id; });
      });
      if (guests.length) {
        var estimate = draftEstimator(allPlayers);
        guests.forEach(function (g) {
          var est = estimate(g.rating);
          // computeDraftSplits берёт K-D как k - d, так что кладём оценку в k.
          players.push({ name: g.name, rating: g.rating, kd: est.kd, k: est.kdDiff, d: 0, guest: true });
        });
      }
      draftState.lastKey = key;
      draftState.lastSplits = computeDraftSplits(players);
    }
    saveDraftGenCount(key, Math.max(used, 1));
    showDraftVariant(0);
  }

  // Показ варианта: рабочая копия составов (draftState.work) — её игроков можно
  // менять местами; исходный вариант остаётся в draftState.lastSplits.
  function showDraftVariant(index) {
    draftState.currentView = index;
    var split = draftState.lastSplits[index];
    draftState.work = { variant: index, teamA: split.teamA.slice(), teamB: split.teamB.slice(), pick: null, dirty: false };
    renderDraftResult(draftState.lastKey, index);
  }

  // Те же показатели, что у split из computeDraftSplits, для произвольных составов.
  function splitStats(teamA, teamB) {
    var diff = function (p) { return p.k - p.d; };
    var avgA = draftAvgOf(teamA, "rating"), avgB = draftAvgOf(teamB, "rating");
    var kdA = draftAvgOf(teamA, "kd"), kdB = draftAvgOf(teamB, "kd");
    var diffA = draftAvgOf(teamA, diff), diffB = draftAvgOf(teamB, diff);
    return {
      avgA: avgA, avgB: avgB, kdA: kdA, kdB: kdB, diffA: diffA, diffB: diffB,
      ratingDiff: Math.abs(avgA - avgB), kdDiff: Math.abs(kdA - kdB), kdDiffDiff: Math.abs(diffA - diffB),
    };
  }

  // Имя для команды боту: запятая, |, = и ~ — служебные символы формата.
  function sanitizeMemberName(name) {
    var clean = String(name).replace(/[,|=~]/g, " ").replace(/\s+/g, " ").trim();
    clean = Array.from(clean).slice(0, DRAFT_GUEST_NAME_MAX).join("").trim();
    return clean || "Игрок";
  }

  // Команда для бота: /teams Имя=steamid64, ..., Гость~рейтинг | ... (см. scripts/lib/matchday.mjs).
  function teamsCommand(teamA, teamB) {
    function member(p) {
      return p.guest
        ? sanitizeMemberName(p.name) + "~" + Math.round(p.rating)
        : sanitizeMemberName(p.name) + "=" + p.steamid64;
    }
    return "/teams " + teamA.map(member).join(", ") + " | " + teamB.map(member).join(", ");
  }

  var BOT_URL = "https://t.me/cs2_stats_tracking_bot";

  // Пул карт вечера; тот же порядок, что MAP_POOL в scripts/lib/matchday.mjs (сверяет тест).
  var MATCHDAY_MAP_POOL = ["de_mirage", "de_dust2", "de_inferno", "de_nuke", "de_ancient", "de_anubis", "de_cache"];

  // Равномерное целое в [0, n) на crypto.getRandomValues (отбрасываем хвост, чтобы не было перекоса).
  function randomBelow(n) {
    var limit = Math.floor(4294967296 / n) * n;
    var buf = new Uint32Array(1);
    do { crypto.getRandomValues(buf); } while (buf[0] >= limit);
    return buf[0] % n;
  }

  // Случайный порядок всех карт пула (Fisher–Yates).
  function shuffleMaps() {
    var order = MATCHDAY_MAP_POOL.slice();
    for (var i = order.length - 1; i > 0; i--) {
      var j = randomBelow(i + 1);
      var tmp = order[i]; order[i] = order[j]; order[j] = tmp;
    }
    return order;
  }

  // Команда для бота: /maps mirage nuke ... (ключи без de_).
  function mapsCommand(order) {
    return "/maps " + order.map(function (k) { return k.replace(/^de_/, ""); }).join(" ");
  }

  var draftMapsOrder = null;

  function wireDraftMaps() {
    document.getElementById("draftMapsBtn").addEventListener("click", function () {
      draftMapsOrder = shuffleMaps();
      document.getElementById("draftMapsRoute").innerHTML = routeHtml(draftMapsOrder);
      document.getElementById("draftMapsActions").hidden = false;
      document.getElementById("draftMapsMsg").textContent = "";
      document.getElementById("draftMapsCmdText").hidden = true;
    });
    document.getElementById("draftCopyMapsBtn").addEventListener("click", function () {
      if (!draftMapsOrder) return;
      copyCommandText(mapsCommand(draftMapsOrder), document.getElementById("draftMapsMsg"), document.getElementById("draftMapsCmdText"));
    });
  }

  // Копирование в буфер; при отказе браузера показываем текст, чтобы скопировать руками.
  function copyCommandText(text, msgEl, textareaEl) {
    function manual() {
      textareaEl.hidden = false;
      textareaEl.value = text;
      textareaEl.focus();
      textareaEl.select();
      msgEl.textContent = "Не удалось скопировать автоматически — скопируй текст ниже вручную";
    }
    if (!navigator.clipboard || !navigator.clipboard.writeText) { manual(); return; }
    navigator.clipboard.writeText(text).then(function () {
      textareaEl.hidden = true;
      msgEl.textContent = "Скопировано";
    }, manual);
  }

  function onDraftPlayerClick(team, index) {
    var w = draftState.work;
    if (!w) return;
    var pick = w.pick;
    if (!pick) {
      w.pick = { team: team, index: index };
    } else if (pick.team === team && pick.index === index) {
      w.pick = null;
    } else if (pick.team === team) {
      w.pick = { team: team, index: index };
    } else {
      var a = pick.team === "A" ? pick : { team: team, index: index };
      var b = pick.team === "A" ? { team: team, index: index } : pick;
      var tmp = w.teamA[a.index];
      w.teamA[a.index] = w.teamB[b.index];
      w.teamB[b.index] = tmp;
      w.pick = null;
      w.dirty = true;
    }
    renderDraftResult(draftState.lastKey, w.variant);
  }

  function renderDraftResult(key, variantIndex) {
    var resultEl = document.getElementById("draftResult");
    var work = draftState.work;
    var split = splitStats(work.teamA, work.teamB);

    function teamHtml(title, teamId, team, avgRating, avgKdDiff, avgKd) {
      var itemsHtml = team.map(function (p, i) {
        var tag = p.guest ? '<span class="draft-guest-tag">гость</span>' : "";
        var picked = work.pick && work.pick.team === teamId && work.pick.index === i;
        return '<li class="draft-swap' + (picked ? " picked" : "") + '" data-team="' + teamId + '" data-index="' + i + '">' +
          "<span>" + escapeHtml(p.name) + tag + "</span><span>" + fmtRating(p.rating) + "</span></li>";
      }).join("");
      return '<div class="draft-team"><h4>' + title + "</h4><ul>" + itemsHtml + "</ul>" +
        '<div class="team-stats">Средний рейтинг: ' + Math.round(avgRating) +
        " · средний K-D: " + fmtDiff(Math.round(avgKdDiff)) +
        " · средний K/D: " + avgKd.toFixed(2) + "</div></div>";
    }

    var used = loadDraftGenCount(key);
    var switchButtonHtml = variantIndex === 0
      ? '<button type="button" class="wheel-spin-btn" id="draftSwitchBtn">' +
        (used < 2 ? "🔁 Сгенерировать ещё раз" : "➡️ Показать 2-й вариант") + "</button>"
      : '<button type="button" class="wheel-spin-btn" id="draftSwitchBtn">⬅️ Показать 1-й вариант</button>';

    resultEl.innerHTML =
      '<div class="draft-teams">' +
        teamHtml("Состав A", "A", work.teamA, split.avgA, split.diffA, split.kdA) +
        teamHtml("Состав B", "B", work.teamB, split.avgB, split.diffB, split.kdB) +
      "</div>" +
      '<div class="draft-variant-note">Нажми на игрока, потом на игрока из другой команды — они поменяются местами. ' +
        "Правки относятся к показанному варианту." +
        (work.dirty ? ' <button type="button" class="draft-link-btn" id="draftResetBtn">Сбросить правки</button>' : "") +
      "</div>" +
      '<div class="draft-summary">Разница в среднем рейтинге — <strong>' + Math.round(split.ratingDiff) +
      "</strong>, в среднем K-D — <strong>" + split.kdDiffDiff.toFixed(1) +
      "</strong>, в среднем K/D — <strong>" + split.kdDiff.toFixed(2) + "</strong>.</div>" +
      (work.teamA.concat(work.teamB).some(function (p) { return p.guest; })
        ? '<div class="draft-variant-note">У гостей K-D и K/D оценены по рейтингу, поэтому средние по составам приблизительные.</div>'
        : "") +
      '<div class="draft-again-wrap">' + switchButtonHtml + "</div>" +
      '<div class="draft-variant-note">Вариант ' + (variantIndex + 1) + " из 2 — больше вариантов для этой десятки не будет.</div>" +
      '<div class="draft-pin">' +
        "<h4>Закрепить на MatchDay</h4>" +
        '<button type="button" class="wheel-spin-btn" id="draftCopyTeamsBtn">Копировать команду для состава</button> ' +
        '<a class="draft-link" href="' + BOT_URL + '" target="_blank" rel="noopener">Открыть бота</a>' +
        '<div class="draft-variant-note" id="draftCopyMsg"></div>' +
        '<textarea class="draft-cmd" id="draftCmdText" readonly hidden rows="4"></textarea>' +
        '<div class="draft-variant-note">Вставь команду в чат с ботом. Дату сессии можно дописать после /teams: ДД.ММ.ГГГГ.</div>' +
      "</div>";

    document.getElementById("draftSwitchBtn").addEventListener("click", function () {
      runDraft(variantIndex === 0);
    });
    resultEl.querySelectorAll("li.draft-swap").forEach(function (li) {
      li.addEventListener("click", function () {
        onDraftPlayerClick(li.dataset.team, Number(li.dataset.index));
      });
    });
    var resetBtn = document.getElementById("draftResetBtn");
    if (resetBtn) resetBtn.addEventListener("click", function () { showDraftVariant(work.variant); });
    document.getElementById("draftCopyTeamsBtn").addEventListener("click", function () {
      copyCommandText(teamsCommand(work.teamA, work.teamB), document.getElementById("draftCopyMsg"), document.getElementById("draftCmdText"));
    });
  }

  // «Карты вечера» на вкладке «Сессии»: по плашке на карту, тап раскрывает две
  // команды с K/D/A. Ассисты показываем только здесь (решение владельца
  // 2026-10-29) — в рейтинги и таблицы они не идут.
  var sessionMapsState = { open: {} };

  function sessionMapScoreText(m) {
    var t = m.teams || [];
    if (t.length === 2 && t[0].score != null && t[1].score != null) {
      return Math.max(t[0].score, t[1].score) + ":" + Math.min(t[0].score, t[1].score);
    }
    return "—";
  }

  function sessionMapBodyHtml(m, avatarOf) {
    var teams = (m.teams || []).map(function (t, i) { return { key: t.key, name: t.name, isWinner: !!t.isWinner, idx: i }; });
    teams.sort(function (a, b) { return (b.isWinner ? 1 : 0) - (a.isWinner ? 1 : 0); });
    var known = {};
    teams.forEach(function (t) { known[t.key] = true; });
    var groups = teams.map(function (t, pos) {
      return { title: t.name || "Команда " + (pos + 1), isWinner: t.isWinner, key: t.key };
    });
    var anyWinner = teams.some(function (t) { return t.isWinner; });
    var stray = (m.players || []).filter(function (p) { return !known[p.team]; });
    if (stray.length) groups.push({ title: "Без команды", isWinner: false, key: null, stray: true });

    return groups.map(function (g) {
      var list = (g.stray ? stray : (m.players || []).filter(function (p) { return p.team === g.key; }))
        .slice().sort(function (a, b) { return b.k - a.k; });
      var rows = list.map(function (p) {
        var av = avatarOf(p.steamid64);
        var avatar = av ? '<img class="sm-avatar" src="' + escapeHtml(av) + '" alt="" loading="lazy">' : '<div class="sm-avatar"></div>';
        return '<div class="sm-p">' + avatar + '<span class="sm-pname">' + escapeHtml(p.name) + "</span>" +
          '<span class="sm-kda">' + p.k + "/" + p.d + "/" + p.a + "</span></div>";
      }).join("");
      var cls = g.isWinner ? " win" : (anyWinner && !g.stray ? " lose" : "");
      return '<div class="sm-team' + cls + '"><h4><span>' + escapeHtml(g.title) + "</span>" +
        (g.isWinner ? '<span class="sm-badge">ПОБЕДА</span>' : "") + "</h4>" +
        '<div class="sm-cols">K / D / A</div>' + rows + "</div>";
    }).join("");
  }

  function renderSessionMapsSection() {
    var el = document.getElementById("sessionMapsSection");
    var s = currentSession();
    if (state.tab !== "lastSession" || !s || !s.maps.length) { el.innerHTML = ""; el.style.display = "none"; return; }
    el.style.display = "";
    var avatars = {};
    ((state.data.allTime && state.data.allTime.players) || []).forEach(function (p) { avatars[p.steamid64] = p.avatarUrl; });
    var avatarOf = function (id) { return avatars[id] || null; };

    var rowsHtml = s.maps.map(function (m, i) {
      var info = mapInfoFor(m.map);
      var name = info ? info.displayName : (m.map || "?");
      var img = info && info.bannerUrl ? '<img src="' + escapeHtml(info.bannerUrl) + '" alt="" loading="lazy">' : "";
      var hasPlayers = m.players && m.players.length;
      var open = !!sessionMapsState.open[m.mapId] && hasPlayers;
      return '<div class="sm-row">' +
        '<button type="button" class="sm-head" data-map-id="' + escapeHtml(m.mapId) + '" aria-expanded="' + (open ? "true" : "false") + '"' + (hasPlayers ? "" : " disabled") + ">" +
          img + '<span class="sm-n">' + (i + 1) + '</span><span class="sm-name">' + escapeHtml(name) + "</span>" +
          '<span class="sm-score">' + escapeHtml(sessionMapScoreText(m)) + '</span><span class="sm-chev">' + (hasPlayers ? (open ? "▾" : "▸") : "") + "</span>" +
        "</button>" +
        (hasPlayers ? '<div class="sm-body"' + (open ? "" : " hidden") + ">" + sessionMapBodyHtml(m, avatarOf) + "</div>" : "") +
      "</div>";
    }).join("");
    el.innerHTML = '<div class="sm-section"><h3>Карты вечера</h3>' + rowsHtml + "</div>";

    el.querySelectorAll(".sm-head").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.dataset.mapId;
        var open = !sessionMapsState.open[id];
        sessionMapsState.open[id] = open;
        btn.setAttribute("aria-expanded", open ? "true" : "false");
        btn.querySelector(".sm-chev").textContent = open ? "▾" : "▸";
        btn.parentNode.querySelector(".sm-body").hidden = !open;
      });
    });
  }

  // "2026-10-31" -> "пятница, 31 октября" (календарная дата без часового пояса).
  function matchdayDateLabel(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || "");
    if (!m) return "";
    var d = new Date(Date.UTC(Number(m[1]), Number(m[2]) - 1, Number(m[3])));
    return d.toLocaleDateString("ru-RU", { weekday: "long", day: "numeric", month: "long", timeZone: "UTC" });
  }

  // Карточка карты по ключу из пула; ключа нет в stats.json — плашка без картинки.
  function mapInfoFor(key) {
    var maps = (state.data && state.data.maps) || [];
    return maps.filter(function (m) { return m.mapKey === key; })[0] || null;
  }

  // «Маршрут вечера»: дорожка с кружками шагов и плашкой каждой карты (фон — её картинка).
  function routeHtml(order) {
    var steps = order.map(function (key, i) {
      var info = mapInfoFor(key);
      var name = info ? info.displayName : key;
      var img = info && info.bannerUrl ? '<img src="' + escapeHtml(info.bannerUrl) + '" alt="" loading="lazy">' : "";
      return '<div class="md-step"><div class="md-num">' + (i + 1) + "</div>" +
        '<div class="md-map">' + img + '<span class="md-map-name">' + escapeHtml(name) + "</span></div></div>";
    }).join("");
    return '<div class="md-route">' + steps + "</div>";
  }

  // Игрок из команды -> то, что показываем. Игрок из списка берётся из stats.json
  // на момент показа; нет в списке -> «Неизвестный игрок».
  function resolveMember(m) {
    if (m.guest !== undefined) {
      return { name: m.guest, avatarUrl: null, rating: m.rating, guest: true, unknown: false };
    }
    var p = ((state.data && state.data.allTime && state.data.allTime.players) || [])
      .filter(function (x) { return x.steamid64 === m.steamid64; })[0];
    if (!p) return { name: "Неизвестный игрок", avatarUrl: null, rating: null, guest: false, unknown: true };
    return { name: p.name, avatarUrl: p.avatarUrl || null, rating: p.rating, guest: false, unknown: false };
  }

  function teamCardHtml(title, members) {
    var resolved = members.map(resolveMember);
    var itemsHtml = resolved.map(function (r) {
      var avatar = r.avatarUrl
        ? '<img class="md-avatar" src="' + escapeHtml(r.avatarUrl) + '" alt="" loading="lazy">'
        : '<div class="md-avatar"></div>';
      var tag = r.guest ? '<span class="draft-guest-tag">гость</span>' : "";
      return "<li>" + avatar + '<span class="md-pname">' + escapeHtml(r.name) + "</span>" + tag +
        '<span class="md-prating">' + fmtRating(r.rating) + "</span></li>";
    }).join("");
    var rated = resolved.filter(function (r) { return r.rating != null; });
    var avg = rated.length ? '<div class="md-avg">Средний рейтинг: ' + Math.round(draftAvgOf(rated, "rating")) + "</div>" : "";
    return '<div class="md-team"><h4>' + escapeHtml(title) + "</h4><ul>" + itemsHtml + "</ul>" + avg + "</div>";
  }

  // Фон "радар": кольца, перекрестие, сканирующий сектор и точки-"игроки".
  var MATCHDAY_RADAR_SVG =
    '<svg class="md-bg" viewBox="0 0 600 210" preserveAspectRatio="xMidYMid slice" aria-hidden="true">' +
      "<defs>" +
        '<linearGradient id="mdRadarSweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="currentColor" stop-opacity="0"/><stop offset="1" stop-color="currentColor" stop-opacity=".35"/></linearGradient>' +
        '<radialGradient id="mdRadarGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="currentColor" stop-opacity=".12"/><stop offset="1" stop-color="currentColor" stop-opacity="0"/></radialGradient>' +
      "</defs>" +
      '<circle cx="300" cy="105" r="230" fill="url(#mdRadarGlow)"/>' +
      '<g fill="none" stroke="currentColor" stroke-opacity=".28" stroke-width="1.2"><circle cx="300" cy="105" r="40"/><circle cx="300" cy="105" r="80"/><circle cx="300" cy="105" r="120"/><circle cx="300" cy="105" r="160"/><path d="M0 105H600M300 -60V270" stroke-opacity=".18"/></g>' +
      '<path d="M300 105 L520 18 A236 236 0 0 1 538 100 Z" fill="url(#mdRadarSweep)"/>' +
      '<circle cx="215" cy="70" r="4" fill="#3ecf6e"/><circle cx="390" cy="150" r="4" fill="#e0923e"/><circle cx="470" cy="70" r="3" fill="#3ecf6e" opacity=".6"/><circle cx="130" cy="150" r="3" fill="#e0923e" opacity=".6"/>' +
    "</svg>";

  function renderMatchdaySection() {
    var el = document.getElementById("matchdaySection");
    if (state.tab !== "matchday") { el.style.display = "none"; return; }
    el.style.display = "";
    var md = state.matchday;
    var empty = !md || (!md.maps && !md.teams);
    var bg = MATCHDAY_RADAR_SVG;
    if (empty) {
      el.innerHTML =
        '<div class="md-section md-empty-state">' + bg +
          '<h2 class="md-title">MatchDay</h2>' +
          '<p class="md-empty-title">Дата следующего матча пока не определена</p>' +
          '<p class="md-empty-sub">Составы и порядок карт появятся здесь, когда их закрепят.</p>' +
        "</div>";
      return;
    }
    el.innerHTML =
      '<div class="md-section">' +
        '<h2 class="md-title">MatchDay</h2>' +
        (md && md.sessionDate ? '<div class="md-date">' + escapeHtml(matchdayDateLabel(md.sessionDate)) + "</div>" : "") +
        (
          '<div class="md-block"><h3>Составы</h3>' +
            (md.teams
              ? '<div class="md-teams">' + teamCardHtml("Состав A", md.teams.teamA) + teamCardHtml("Состав B", md.teams.teamB) + "</div>" +
                '<div class="md-saved">Закреплено ' + escapeHtml(formatDateTime(md.teams.savedAt)) + "</div>"
              : '<p class="md-empty">Составы пока не определены.</p>') +
          "</div>" +
          '<div class="md-block"><h3>Маршрут вечера</h3>' +
            (md.maps
              ? routeHtml(md.maps.order) + '<div class="md-saved">Закреплено ' + escapeHtml(formatDateTime(md.maps.savedAt)) + "</div>"
              : '<p class="md-empty">Порядок карт пока не определён.</p>') +
          "</div>") +
      "</div>";
  }

  function formatDateTime(iso) {
    if (!iso) return "—";
    var d = new Date(iso);
    return d.toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
})();
</script>
</body>
</html>
